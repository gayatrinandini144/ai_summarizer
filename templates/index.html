<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Text Summarizer</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95);
    min-height: 100vh; margin: 0; padding: 40px 20px; color: #1f2937;
  }
  .container {
    max-width: 800px; margin: 0 auto; background: #fff;
    border-radius: 16px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  h1 { margin-top: 0; color: #4c1d95; text-align: center; }
  p.subtitle { text-align: center; color: #6b7280; margin-top: -8px; margin-bottom: 24px; }
  textarea {
    width: 100%; min-height: 220px; padding: 14px; border: 2px solid #e5e7eb;
    border-radius: 10px; font-size: 15px; resize: vertical; font-family: inherit;
  }
  textarea:focus { outline: none; border-color: #7c3aed; }
  .controls { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; flex-wrap: wrap; gap: 12px; }
  select, button { padding: 10px 16px; border-radius: 8px; border: 2px solid #e5e7eb; font-size: 14px; }
  button { background: #7c3aed; color: #fff; border: none; cursor: pointer; font-weight: 600; transition: background .2s; }
  button:hover:not(:disabled) { background: #6d28d9; }
  button:disabled { background: #a78bfa; cursor: not-allowed; }
  .word-count { color: #9ca3af; font-size: 13px; }
  #result { margin-top: 24px; padding: 20px; background: #f5f3ff; border-left: 4px solid #7c3aed; border-radius: 8px; display: none; }
  #result h3 { margin-top: 0; color: #4c1d95; display: flex; justify-content: space-between; align-items: center; }
  #copyBtn { padding: 6px 12px; font-size: 12px; }
  #summaryText { white-space: pre-wrap; line-height: 1.55; }
  .stats { display: flex; gap: 20px; margin-top: 12px; font-size: 13px; color: #6b7280; flex-wrap: wrap; }
  .error { color: #dc2626; background: #fef2f2; padding: 12px; border-radius: 8px; margin-top: 16px; display: none; }
  .spinner { display: none; text-align: center; color: #7c3aed; margin-top: 16px; }
</style>
</head>
<body>
  <div class="container">
    <h1>📝 AI Text Summarizer</h1>
    <p class="subtitle">Paste any long text and get a concise summary from a large language model</p>

    <textarea id="inputText" placeholder="Paste your article, notes, or paragraph here (at least 30 words)..."></textarea>
    <div class="word-count" id="wordCount">0 words</div>

    <div class="controls">
      <div>
        <label for="length">Length: </label>
        <select id="length">
          <option value="short">Short</option>
          <option value="medium" selected>Medium</option>
          <option value="long">Long</option>
        </select>
      </div>
      <div>
        <label for="style">Format: </label>
        <select id="style">
          <option value="paragraph" selected>Paragraph</option>
          <option value="bullets">Bullet points</option>
        </select>
      </div>
      <button id="summarizeBtn" onclick="summarize()">Summarize</button>
    </div>

    <div class="spinner" id="spinner">⏳ Summarizing...</div>
    <div class="error" id="error"></div>

    <div id="result">
      <h3>Summary <button id="copyBtn" onclick="copySummary()">Copy</button></h3>
      <p id="summaryText"></p>
      <div class="stats">
        <span id="statOriginal"></span>
        <span id="statSummary"></span>
        <span id="statReduction"></span>
      </div>
    </div>
  </div>

<script>
const textarea = document.getElementById('inputText');
const wordCount = document.getElementById('wordCount');

textarea.addEventListener('input', () => {
  const words = textarea.value.trim().split(/\s+/).filter(Boolean).length;
  wordCount.textContent = words + ' words';
});

function copySummary() {
  navigator.clipboard.writeText(document.getElementById('summaryText').textContent);
  const b = document.getElementById('copyBtn');
  b.textContent = 'Copied!';
  setTimeout(() => b.textContent = 'Copy', 1500);
}

async function summarize() {
  const text = textarea.value.trim();
  const length = document.getElementById('length').value;
  const style = document.getElementById('style').value;
  const btn = document.getElementById('summarizeBtn');
  const spinner = document.getElementById('spinner');
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');

  errorDiv.style.display = 'none';
  resultDiv.style.display = 'none';

  if (!text) {
    errorDiv.textContent = 'Please enter some text first.';
    errorDiv.style.display = 'block';
    return;
  }

  btn.disabled = true;
  spinner.style.display = 'block';

  try {
    const res = await fetch('/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, length, style })
    });
    const data = await res.json();

    if (!res.ok) {
      errorDiv.textContent = data.error || 'Something went wrong.';
      errorDiv.style.display = 'block';
    } else {
      document.getElementById('summaryText').textContent = data.summary;
      document.getElementById('statOriginal').textContent = 'Original: ' + data.original_words + ' words';
      document.getElementById('statSummary').textContent = 'Summary: ' + data.summary_words + ' words';
      document.getElementById('statReduction').textContent = 'Reduced by: ' + data.reduction + '%';
      resultDiv.style.display = 'block';
    }
  } catch (err) {
    errorDiv.textContent = 'Could not reach the server.';
    errorDiv.style.display = 'block';
  } finally {
    btn.disabled = false;
    spinner.style.display = 'none';
  }
}
</script>
</body>
</html>
