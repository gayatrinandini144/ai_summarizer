<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summarizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f5f7; --surface: #ffffff; --ink: #1b2430; --muted: #5b6775;
    --line: #d5dce3; --accent: #0b7a75; --accent-ink: #ffffff; --danger: #b42318;
    --ui: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --text: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12171c; --surface: #1a2128; --ink: #e6ebf0; --muted: #98a4b1;
      --line: #2c3640; --accent: #4cc2b8; --accent-ink: #0c1a19; --danger: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); line-height: 1.5; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 56px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 16px; }
  .group { display: flex; align-items: center; gap: 10px; }
  .group > span { font-size: .875rem; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 7px 14px; font-size: .875rem; color: var(--muted); border-right: 1px solid var(--line); }
  .seg label:last-child span { border-right: 0; }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); font-weight: 500; }
  .seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: -2px; }

  button { font-family: inherit; font-size: .9rem; border-radius: 8px; cursor: pointer; }
  .primary { margin-left: auto; padding: 10px 22px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .primary:disabled { opacity: .55; cursor: wait; }
  .ghost { padding: 5px 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: .8rem; }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 420px; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: .875rem; color: var(--muted); }
  .pane-head strong { color: var(--ink); font-weight: 500; }
  .pane-actions { display: flex; gap: 8px; }
  textarea, .out { flex: 1; width: 100%; padding: 16px 18px; font-family: var(--text); font-size: 1.05rem; line-height: 1.65; color: var(--ink); background: transparent; border: 0; resize: none; }
  textarea::placeholder { color: var(--muted); }
  .out { white-space: pre-wrap; overflow-y: auto; }
  .empty { color: var(--muted); font-family: var(--ui); font-size: .95rem; }
  .err { color: var(--danger); font-family: var(--ui); font-size: .95rem; }

  .meter { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; display: none; }
  .meter-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 12px; font-size: .875rem; color: var(--muted); }
  .meter-row + .meter-row { margin-top: 8px; }
  .track { height: 10px; background: var(--paper); border-radius: 5px; overflow: hidden; }
  .fill { height: 100%; background: var(--line); border-radius: 5px; width: 100%; }
  .fill.sum { background: var(--accent); width: 0; transition: width .5s ease; }
  .meter-note { margin: 10px 0 0; font-size: .875rem; }

  @media (max-width: 760px) { .panes { grid-template-columns: 1fr; } .pane { min-height: 260px; } .primary { margin-left: 0; width: 100%; } }
  @media (prefers-reduced-motion: reduce) { .fill.sum { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Summarizer</h1>
    <p>Paste a long text on the left. Get the short version on the right.</p>
  </header>

  <div class="bar">
    <div class="group" role="radiogroup" aria-label="Summary length">
      <span>Length</span>
      <div class="seg">
        <label><input type="radio" name="length" value="short"><span>Short</span></label>
        <label><input type="radio" name="length" value="medium" checked><span>Medium</span></label>
        <label><input type="radio" name="length" value="long"><span>Long</span></label>
      </div>
    </div>
    <div class="group" role="radiogroup" aria-label="Summary format">
      <span>Format</span>
      <div class="seg">
        <label><input type="radio" name="style" value="paragraph" checked><span>Paragraph</span></label>
        <label><input type="radio" name="style" value="bullets"><span>Bullets</span></label>
      </div>
    </div>
    <button class="primary" id="go">Summarize</button>
  </div>

  <div class="panes">
    <section class="pane" aria-label="Original text">
      <div class="pane-head">
        <strong>Original</strong>
        <div class="pane-actions">
          <span id="count">0 words</span>
          <button class="ghost" id="sample" type="button">Try a sample</button>
          <button class="ghost" id="clear" type="button">Clear</button>
        </div>
      </div>
      <textarea id="text" placeholder="Paste an article, notes, or an email thread. Needs at least 30 words."></textarea>
    </section>

    <section class="pane" aria-label="Summary" aria-live="polite">
      <div class="pane-head">
        <strong>Summary</strong>
        <div class="pane-actions"><button class="ghost" id="copy" type="button">Copy</button></div>
      </div>
      <div class="out" id="out"><span class="empty">Your summary appears here. Press Ctrl + Enter to run it from the keyboard.</span></div>
    </section>
  </div>

  <div class="meter" id="meter">
    <div class="meter-row"><span id="oLabel">Original</span><div class="track"><div class="fill"></div></div></div>
    <div class="meter-row"><span id="sLabel">Summary</span><div class="track"><div class="fill sum" id="sBar"></div></div></div>
    <p class="meter-note" id="note"></p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const text = $('text'), out = $('out'), go = $('go');
const SAMPLE = "Honey bees communicate the location of food through a movement known as the waggle dance. A forager that finds a rich patch of flowers returns to the hive and moves in a figure-eight pattern. The angle of the central run, measured against vertical, shows the direction of the food relative to the sun, and the length of the run signals the distance. Other bees follow the dancer closely, then fly out to the same spot. Researchers who first decoded the dance in the 1940s found that colonies using it gather food far more efficiently than bees searching alone. The dance also adapts to conditions: on cloudy days bees rely on polarized light, and when a strong wind blows they correct for drift.";
const words = s => s.trim().split(/\s+/).filter(Boolean).length;
const pick = name => document.querySelector(`input[name="${name}"]:checked`).value;

text.addEventListener('input', () => $('count').textContent = words(text.value) + ' words');
$('sample').onclick = () => { text.value = SAMPLE; text.dispatchEvent(new Event('input')); };
$('clear').onclick = () => {
  text.value = ''; text.dispatchEvent(new Event('input'));
  out.innerHTML = '<span class="empty">Your summary appears here. Press Ctrl + Enter to run it from the keyboard.</span>';
  $('meter').style.display = 'none';
};
$('copy').onclick = async () => {
  const t = out.dataset.summary; if (!t) return;
  await navigator.clipboard.writeText(t);
  $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy', 1500);
};
text.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') go.click(); });

function showError(msg) {
  out.dataset.summary = '';
  out.innerHTML = '';
  const p = document.createElement('span'); p.className = 'err'; p.textContent = msg; out.appendChild(p);
  $('meter').style.display = 'none';
}

go.onclick = async () => {
  const value = text.value.trim();
  if (words(value) < 30) return showError('Add at least 30 words so there is something to summarize.');
  go.disabled = true; go.textContent = 'Summarizing…';
  out.innerHTML = '<span class="empty">Reading your text…</span>';
  try {
    const res = await fetch('/summarize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: value, length: pick('length'), style: pick('style') })
    });
    const d = await res.json();
    if (!res.ok) return showError(d.error || 'Something went wrong. Try again.');
    out.textContent = d.summary; out.dataset.summary = d.summary;
    $('oLabel').textContent = d.original_words + ' words';
    $('sLabel').textContent = d.summary_words + ' words';
    $('note').textContent = 'Shortened by ' + Math.round(d.reduction) + '%.';
    $('meter').style.display = 'block';
    const sBar = $('sBar'); sBar.style.width = '0';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      sBar.style.width = Math.max(2, 100 - d.reduction) + '%';
    }));
  } catch (e) {
    showError('Could not reach the server. Check your connection and try again.');
  } finally {
    go.disabled = false; go.textContent = 'Summarize';
  }
};
</script>
</body>
</html>
